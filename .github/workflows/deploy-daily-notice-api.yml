name: Deploy Daily Notice API to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'daily-notice/backend/**'
      - 'daily-notice/lib/ai-meal-*.mjs'
      - 'daily-notice/lib/meal-*.mjs'
      - 'daily-notice/integrations/iroiro/**'
      - 'daily-notice/package*.json'
      - 'daily-notice/ci/**'
      - '.github/workflows/deploy-daily-notice-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-notice-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-notice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: daily-notice/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Deploy only the Daily Notice Worker
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_ACCOUNT_ID: '1329ff2a51a1994d2bc91d563267bdc4'
          CLOUDFLARE_API_TOKEN: ${{ secrets.DAILY_NOTICE_CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/daily-notice-upload.jsonl"
          npx --yes wrangler@4.156.0 versions upload --config backend/wrangler.jsonc
          DAILY_NOTICE_VERSION=$(node ci/read-worker-version.mjs)
          npx --yes wrangler@4.156.0 versions deploy "$DAILY_NOTICE_VERSION@100%" --yes --config backend/wrangler.jsonc
