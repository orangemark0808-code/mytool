name: Deploy Daily Notice API to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'daily-notice/backend/**'
      - 'daily-notice/lib/ai-meal-*.mjs'
      - 'daily-notice/lib/meal-*.mjs'
      - 'daily-notice/integrations/iroiro/**'
      - 'daily-notice/package*.json'
      - 'daily-notice/ci/**'
      - '.github/workflows/deploy-daily-notice-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-notice-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-notice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: daily-notice/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Deploy only the Daily Notice Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: '1329ff2a51a1994d2bc91d563267bdc4'
          CLOUDFLARE_API_TOKEN: ${{ secrets.DAILY_NOTICE_CLOUDFLARE_API_TOKEN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes esbuild@0.27.3 backend/worker.mjs --bundle --format=esm --platform=browser --target=es2022 --outfile=.worker-dist/worker.mjs
          node ci/deploy-worker.mjs
