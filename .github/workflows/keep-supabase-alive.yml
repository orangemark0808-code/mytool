name: Keep Supabase Alive (nazoiki calendar)

# Supabase の無料プランは、しばらく使われないと自動で一時停止します。
# 毎日1回、なぞいき投稿カレンダーと同じデータにアクセスして、停止を防ぎます。

on:
  schedule:
    - cron: '17 18 * * *'   # 毎日 03:17（日本時間）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Access Supabase
        run: |
          # 公開用キー（カレンダーのページにも書かれているもの）
          URL="https://vwfzlcgfgffknpmselzy.supabase.co/rest/v1/nazoiki_calendar_posts?select=*&limit=1"
          KEY="sb_publishable_0LpdSdGbLIcC0P5rkVXgpg_1SN3sR-p"
          code=$(curl -sS -o response.json -w "%{http_code}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL")
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            cat response.json
            exit 1
          fi
