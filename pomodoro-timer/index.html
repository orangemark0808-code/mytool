<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf8f4">
  <title>ポモドーロタイマー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,400&family=DM+Mono:wght@300;400&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#faf8f4; --surface:#faf8f4; --surface2:#ede9e1; --border:#d8d3c8; --accent:#ff7f00; --accent-deep:#d2691e; --accent-light:#fff0e0; --accent-sub:#e8943a; --text:#3a2a1a; --muted:#3a2a1a; --highlight:#ffe0b2; --radius:14px; --shadow:none; }
    * { box-sizing:border-box; margin:0; }
    body { min-width:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Nunito',sans-serif; line-height:1.7; transition:background-color .25s ease; padding:32px 0 calc(32px + env(safe-area-inset-bottom)); }
    body.notification-active { background:#ffe0b2; }
    .completion-notice { position:fixed; z-index:150; left:50%; top:50%; width:min(100% - 32px,420px); transform:translate(-50%,-50%) scale(.97); background:var(--accent-light); border:1px solid var(--accent); border-radius:var(--radius); color:var(--text); opacity:0; padding:24px 22px calc(24px + env(safe-area-inset-bottom)); pointer-events:none; text-align:center; transition:opacity .2s ease,transform .2s ease; }
    .completion-notice.show { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
    .completion-notice__eyebrow { color:var(--accent-deep); font-family:'DM Mono',monospace; font-size:12px; letter-spacing:.14em; }
    .completion-notice__title { font-size:22px; font-weight:600; line-height:1.45; margin-top:8px; }
    .completion-notice__detail { font-size:15px; margin-top:4px; }
    @media (prefers-reduced-motion: reduce) { body,.completion-notice { transition:none; } }
    button,input { font:inherit; }
    .container { width:min(100% - 32px,520px); margin:0 auto; padding:28px; text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
    .app-header { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:32px; }
    h1 { font-family:'Lora',serif; font-size:24px; font-weight:600; line-height:1.3; white-space:nowrap; word-break:normal; }
    .notification-diagnostics { border-top:1px solid var(--border); color:var(--muted); font-family:'DM Mono',monospace; font-size:10px; line-height:1.65; margin-top:18px; padding-top:14px; text-align:left; }
    .notification-diagnostics__note { font-family:'Nunito',sans-serif; font-size:11px; margin-top:8px; }
    .diagnostic-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .diagnostic-actions button { min-height:38px; font-size:12px; padding:7px 10px; }
    .version-badge,.eyebrow,.session-count { font-family:'DM Mono',monospace; }
    .version-badge { border:1px solid var(--border); border-radius:8px; background:var(--accent-light); color:var(--accent-deep); font-size:10px; line-height:1; padding:5px 7px; white-space:nowrap; }
    .mode-label { margin-bottom:14px; }
    .eyebrow { display:block; color:var(--accent-deep); font-size:11px; font-weight:400; letter-spacing:.16em; line-height:1.3; }
    .mode-name { display:block; font-size:15px; font-weight:600; margin-top:3px; }
    .progress-ring-wrapper { position:relative; width:min(62vw,260px); height:min(62vw,260px); margin:0 auto 28px; }
    .progress-ring { width:100%; height:100%; transform:rotate(-90deg); }
    .progress-ring__track { fill:none; stroke:var(--surface2); stroke-width:8; }
    .progress-ring__progress { fill:none; stroke:var(--accent); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
    .timer-display { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:100%; }
    .time { color:var(--text); font-family:'DM Mono',monospace; font-size:clamp(42px,13vw,64px); font-weight:300; font-variant-numeric:tabular-nums; letter-spacing:-.08em; line-height:1; }
    .session-count { color:var(--muted); font-size:11px; letter-spacing:.04em; margin-top:12px; }
    .controls { display:flex; justify-content:center; gap:10px; margin-bottom:22px; }
    button { min-height:44px; border:1px solid transparent; border-radius:10px; cursor:pointer; font-size:15px; font-weight:600; transition:background-color .2s ease,opacity .2s ease; }
    button:hover { opacity:.84; }
    .btn-start { background:var(--accent); color:#fff; padding:10px 34px; }
    .btn-reset,.btn-apply,.sound-test,.permission-bar .btn-later { background:var(--surface2); border-color:var(--border); color:var(--text); padding:10px 18px; }
    .mode-tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:18px; }
    .tab { min-height:48px; background:transparent; border-color:var(--border); color:var(--text); padding:8px 12px; font-size:14px; }
    .tab.active-work,.tab.active-break { background:var(--accent-light); border-color:var(--accent); color:var(--accent-deep); }
    .log { min-height:25px; color:var(--muted); font-size:13px; }
    .settings { border-top:1px solid var(--border); margin-top:26px; padding-top:22px; text-align:left; }
    .settings-title { margin-bottom:14px; }
    .settings-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .settings label { color:var(--text); display:grid; font-size:13px; gap:5px; }
    .input-row { align-items:center; display:flex; gap:5px; }
    .settings input[type="number"] { appearance:auto; width:100%; min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'DM Mono',monospace; font-size:14px; padding:8px; text-align:center; }
    .settings input[type="number"]:focus { border-color:var(--accent); outline:1px solid var(--accent); }
    .settings-actions { margin-top:14px; text-align:center; }
    .btn-apply { width:100%; }
    .sound-test { margin-top:12px; padding:8px 16px; font-size:13px; }
    .notify-banner { position:fixed; top:20px; left:50%; width:min(100% - 32px,420px); transform:translate(-50%,-120px); z-index:100; background:var(--accent-light); border:1px solid var(--accent); border-radius:10px; color:var(--text); font-size:14px; font-weight:600; padding:12px 16px; text-align:center; transition:transform .25s ease; }
    .notify-banner.show { transform:translate(-50%,0); }
    .permission-bar { align-items:center; background:var(--surface); border-top:1px solid var(--border); bottom:0; color:var(--text); display:flex; font-size:14px; gap:12px; justify-content:center; left:0; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); position:fixed; right:0; z-index:200; }
    .permission-bar__text { max-width:560px; }
    .permission-bar__actions { display:flex; flex-shrink:0; gap:8px; }
    .permission-bar button { min-height:38px; font-size:13px; padding:7px 14px; }
    .permission-bar #notifAllowBtn { background:var(--accent); color:#fff; padding:7px 14px; }
    .permission-bar.hidden { display:none; }
    @media (max-width:420px) { body { padding-top:16px; } .container { padding:22px 16px; } .app-header { flex-direction:column; gap:8px; margin-bottom:25px; } .app-header h1 { font-size:clamp(20px,6vw,24px); white-space:nowrap; } .settings-grid { grid-template-columns:1fr 1fr; } .settings label:last-child { grid-column:1 / -1; } .permission-bar { align-items:stretch; flex-direction:column; text-align:center; } .permission-bar__actions { justify-content:center; } }
  </style>
</head>
<body>
  <div class="notify-banner" id="notifyBanner">タイマーが終了しました</div>
  <div class="completion-notice" id="completionNotice" role="status" aria-live="assertive"><p class="completion-notice__eyebrow" id="completionEyebrow"></p><p class="completion-notice__title" id="completionTitle"></p><p class="completion-notice__detail" id="completionDetail"></p></div>
  <div class="permission-bar hidden" id="permissionBar"><p class="permission-bar__text">画面を閉じている間も通知を受け取るには、通知を許可してください。</p><div class="permission-bar__actions"><button id="notifAllowBtn">通知を許可</button><button class="btn-later" id="notifLaterBtn">後で</button></div></div>
  <main class="container">
    <header class="app-header"><h1>ポモドーロタイマー</h1><span class="version-badge">2026-07-26-04</span></header>
    <div class="mode-label"><span class="eyebrow" id="modeLabelEn">FOCUS</span><span class="mode-name" id="modeLabelJa">作業中</span></div>
    <div class="progress-ring-wrapper"><svg class="progress-ring" viewBox="0 0 240 240" aria-label="タイマー進行状況"><circle class="progress-ring__track" cx="120" cy="120" r="108"/><circle class="progress-ring__progress" id="progressCircle" cx="120" cy="120" r="108"/></svg><div class="timer-display"><div class="time" id="timeDisplay">50:00</div><div class="session-count" id="sessionCount">SET 01 / 03 · FOCUS</div></div></div>
    <div class="controls"><button class="btn-start" id="startBtn">開始</button><button class="btn-reset" id="resetBtn">リセット</button></div>
    <div class="mode-tabs"><button class="tab active-work" id="tabWork">作業 50分</button><button class="tab" id="tabBreak">休憩 10分</button></div>
    <div class="log" id="logText" aria-live="polite"></div>
    <section class="settings" aria-label="設定"><span class="eyebrow settings-title">SETTINGS</span><div class="settings-grid"><label>作業時間 <span class="input-row"><input type="number" id="inputWork" min="1" max="180" value="50">分</span></label><label>休憩時間 <span class="input-row"><input type="number" id="inputBreak" min="1" max="60" value="10">分</span></label><label>セット数 <span class="input-row"><input type="number" id="inputSets" min="1" max="99" value="3">回</span></label></div><div class="settings-actions"><button class="btn-apply" id="applyBtn">設定を適用</button><button class="sound-test" id="soundTestBtn">通知音をテスト</button><div class="diagnostic-actions"><button class="sound-test" id="vibrationTestBtn">振動をテスト</button><button class="sound-test" id="notificationTestBtn">通知をテスト</button><button class="sound-test" id="diagnosticsRefreshBtn">通知状態を更新</button><button class="sound-test" id="diagnosticsCopyBtn">診断情報をコピー</button></div><div class="notification-diagnostics" id="notificationStatus" aria-live="polite"></div></div></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
